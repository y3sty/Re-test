<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Три Загадки</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text: #1a1f3a;
            --green: #4caf50;
            --red: #e8857c;
            --r: 12px;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: default;
        }

        /* Фиксированный фоновый слой */
        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            z-index: -1;
        }

        /* Эффект жары */
        .heatWave {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at 85% 15%, rgba(255,200,100,0.1) 0%, transparent 50%);
            animation: heatShimmer 4s ease-in-out infinite;
        }

        @keyframes heatShimmer {
            0%, 100% { transform: scaleY(1) translateY(0); }
            25% { transform: scaleY(1.02) translateY(-2px); }
            50% { transform: scaleY(1.04) translateY(2px); }
            75% { transform: scaleY(1.02) translateY(-1px); }
        }

        .grain {
            position: fixed; 
            inset: -50%; 
            z-index: 2; 
            pointer-events: none; 
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            animation: grain-drift 12s steps(3) infinite;
        }
        @keyframes grain-drift { 
            0%,100%{transform:translate(0,0)} 
            33%{transform:translate(-2px,1px)} 
            66%{transform:translate(1px,-2px)} 
        }

        .app { 
            position: relative; 
            z-index: 3; 
            width: 100%; 
            max-width: 500px; 
            padding: 2rem 1.5rem;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .app.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        /* Кнопка переключения интерфейса */
        .toggle-interface-btn {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 200;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(251,191,36,0.8), rgba(245,158,11,0.8));
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(217,119,6,0.2);
            padding: 0;
        }

        .toggle-interface-btn:hover {
            background: linear-gradient(135deg, rgba(253,224,71,0.9), rgba(251,191,36,0.9));
            box-shadow: 0 6px 20px rgba(217,119,6,0.3);
            transform: scale(1.05);
        }

        .toggle-interface-btn:active {
            transform: scale(0.95);
        }

        /* ПК версия - кнопка больше */
        @media (min-width: 769px) {
            .toggle-interface-btn {
                width: 70px;
                height: 70px;
                font-size: 2.4rem;
            }
        }

        .code-strip {
            display: flex; 
            justify-content: center; 
            gap: 1.2rem;
            margin-bottom: 1.8rem; 
            min-height: 3rem; 
            align-items: center;
        }
        
        .code-digit {
            width: 56px; 
            height: 56px; 
            border-radius: 10px;
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.35);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 1.4rem; 
            font-weight: 700;
            font-family: 'Inter', monospace;
            color: transparent;
            transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
            letter-spacing: 0.03em;
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 
                0 8px 32px rgba(31, 38, 135, 0.15),
                inset 0 2px 4px rgba(255,255,255,0.4);
        }
        
        .code-digit.revealed {
            color: #d97706;
            border-color: rgba(217,119,6,0.6);
            background: rgba(254,243,199,0.4);
            box-shadow: 
                0 8px 32px rgba(217,119,6,0.2),
                inset 0 2px 4px rgba(255,255,255,0.5),
                0 0 30px rgba(217,119,6,0.3);
            animation: digit-pop 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        
        @keyframes digit-pop {
            0% { transform: scale(0.7); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .header { 
            text-align: center; 
            margin-bottom: 2.2rem;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: var(--r);
            padding: 1.8rem 1.6rem;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow:
                0 8px 32px rgba(31, 38, 135, 0.2),
                inset 0 2px 4px rgba(255,255,255,0.4);
            border-top: 2px solid rgba(255,255,255,0.5);
            border-left: 2px solid rgba(255,255,255,0.3);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
            animation: shimmer 3s ease-in-out infinite;
        }

        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.4rem; 
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #d97706;
            text-shadow: 0 4px 12px rgba(217,119,6,0.2);
            line-height: 1.3;
            position: relative;
            z-index: 1;
            word-spacing: normal;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        /* Анимация переливания цвета для заголовка */
        @keyframes colorPulse {
            0% {
                color: #d97706;
                text-shadow: 0 4px 12px rgba(217,119,6,0.2);
            }
            50% {
                color: #ffffff;
                text-shadow: 0 4px 12px rgba(255,255,255,0.4);
            }
            100% {
                color: #d97706;
                text-shadow: 0 4px 12px rgba(217,119,6,0.2);
            }
        }

        .header h1.pulsing {
            animation: colorPulse 1.5s ease-in-out infinite;
            cursor: default;
        }

        /* Когда все загадки решены - просто меняем курсор */
        .header h1.clickable {
            cursor: pointer;
        }

        .header h1 span {
            display: block;
            font-size: 1.4rem;
            color: #4a9fd8;
            text-shadow: 0 2px 6px rgba(74,159,216,0.2);
            margin-top: -4px;
        }
        
        .header .sub {
            font-size: 0.85rem; 
            color: #7a8a9e; 
            margin-top: 0.5rem;
            font-weight: 400; 
            letter-spacing: 0;
            position: relative;
            z-index: 1;
        }

        /* GLASSMORPHISM */
        .card {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: var(--r);
            padding: 1.6rem 1.6rem 1.8rem;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transition: all 0.4s ease;
            margin-bottom: 0.8rem;
            position: relative; 
            overflow: hidden;
            box-shadow:
                0 8px 32px rgba(31, 38, 135, 0.2),
                inset 0 2px 4px rgba(255,255,255,0.4);
            border-top: 2px solid rgba(255,255,255,0.5);
            border-left: 2px solid rgba(255,255,255,0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, 20px); }
        }

        .card::after {
            content: '';
            position: absolute; 
            top: -8px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 40px; 
            height: 10px;
            background: linear-gradient(180deg, rgba(217,119,6,0.3), rgba(217,119,6,0.05));
            border-radius: 3px 3px 0 0;
            opacity: 0.6;
            z-index: 1;
        }

        .card.done {
            border-color: rgba(76,175,80,0.4);
            background: rgba(200,255,200,0.15);
            box-shadow: 
                0 8px 32px rgba(76,175,80,0.15),
                inset 0 2px 4px rgba(255,255,255,0.5);
        }

        .card .q {
            font-size: 0.9rem; 
            font-weight: 500; 
            margin-bottom: 0.85rem;
            transition: color 0.2s;
            word-break: break-all; 
            overflow-wrap: anywhere; 
            line-height: 1.5;
            color: var(--text);
            position: relative;
            z-index: 2;
        }

        .card .q.error {
            color: var(--red);
            animation: q-flash 0.7s ease;
        }

        @keyframes q-flash {
            0%,100%{color:var(--text)}
            30%{color:var(--red)}
            70%{color:var(--red)}
        }

        .card .attempts { 
            font-size: 0.68rem; 
            color: #7a8a9e; 
            margin-bottom: 0.6rem; 
            min-height: 1em; 
            transition: color 0.3s;
            position: relative;
            z-index: 2;
        }

        .row { 
            display: flex; 
            gap: 0.5rem;
            position: relative;
            z-index: 2;
        }

        .row input {
            flex: 1; 
            height: 44px;
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 8px;
            padding: 0 0.9rem; 
            color: var(--text); 
            font-size: 0.9rem;
            font-family: inherit; 
            font-weight: 450;
            outline: none; 
            transition: all 0.3s;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .row input::placeholder {
            color: rgba(45, 58, 74, 0.5);
        }

        .row input:focus {
            border-color: rgba(217,119,6,0.6);
            background: rgba(255,255,255,0.4);
            box-shadow: 0 0 20px rgba(217,119,6,0.2);
        }

        .row input.shake {
            border-color: var(--red);
            animation: shake 0.4s ease;
        }

        @keyframes shake { 
            0%,100%{transform:translateX(0)} 
            20%{transform:translateX(-5px)} 
            40%{transform:translateX(5px)} 
            60%{transform:translateX(-3px)} 
            80%{transform:translateX(3px)} 
        }

        .row button {
            height: 44px; 
            padding: 0 1.3rem; 
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(251,191,36,0.8), rgba(245,158,11,0.8));
            color: #78350f; 
            font-size: 0.85rem; 
            font-weight: 600;
            font-family: inherit; 
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: 
                0 4px 15px rgba(217,119,6,0.2),
                inset 0 1px 2px rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .row button:hover {
            background: linear-gradient(135deg, rgba(253,224,71,0.9), rgba(251,191,36,0.9));
            box-shadow: 
                0 6px 20px rgba(217,119,6,0.3),
                inset 0 1px 2px rgba(255,255,255,0.4);
        }

        .row button:active { 
            transform: scale(0.95); 
        }

        .done-row {
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            height: 44px;
            color: var(--green); 
            font-weight: 550; 
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
        }

        .done-row .check-svg { 
            width: 26px; 
            height: 26px; 
            flex-shrink: 0; 
        }

        .done-row .check-svg circle {
            fill: none; 
            stroke: rgba(76,175,80,0.4); 
            stroke-width: 2;
            stroke-dasharray: 63; 
            stroke-dashoffset: 63;
            animation: circle-draw 0.6s 0.1s ease forwards;
        }

        .done-row .check-svg polyline {
            fill: none; 
            stroke: var(--green); 
            stroke-width: 2.5;
            stroke-linecap: round; 
            stroke-linejoin: round;
            stroke-dasharray: 22; 
            stroke-dashoffset: 22;
            animation: check-draw 0.4s 0.4s ease forwards;
        }

        @keyframes circle-draw { to { stroke-dashoffset: 0; } }
        @keyframes check-draw { to { stroke-dashoffset: 0; } }

        .step-hidden {
            display: none; 
            opacity: 0; 
            transform: translateY(12px);
        }

        .step-hidden.reveal {
            display: block;
            animation: stepIn 0.5s ease forwards;
        }

        @keyframes stepIn { to { opacity: 1; transform: translateY(0); } }

        .lock-box {
            display: flex; 
            align-items: center; 
            gap: 0.6rem; 
            padding: 1rem 1.3rem;
            border: 2px dashed rgba(255,255,255,0.3); 
            border-radius: var(--r);
            background: rgba(255,255,255,0.15);
            color: #5a6a7a; 
            font-size: 0.84rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
        }

        .lock-box .lk {
            width: 34px; 
            height: 34px; 
            border-radius: 6px;
            background: rgba(217,119,6,0.1);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }

        .toast {
            position: fixed; 
            bottom: 1.5rem; 
            left: 50%; 
            transform: translateX(-50%) translateY(120px);
            background: rgba(255,255,255,0.25); 
            border: 2px solid rgba(255,255,255,0.35);
            color: var(--text); 
            padding: 0.7rem 1.5rem; 
            border-radius: 8px;
            font-size: 0.84rem; 
            font-weight: 500;
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            z-index: 100; 
            transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); 
            pointer-events: none;
            box-shadow: 
                0 8px 32px rgba(31, 38, 135, 0.15),
                inset 0 1px 2px rgba(255,255,255,0.3);
        }

        .toast.show { 
            transform: translateX(-50%) translateY(0); 
        }

        noscript {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffa500 50%, #ff1493 100%);
            display: flex; 
            align-items: center; 
            justify-content: center;
            z-index: 9999;
        }

        noscript p {
            text-align: center; 
            color: white; 
            font-size: 1.2rem; 
            padding: 2rem;
            max-width: 400px;
        }

        @media (max-width: 460px) {
            .app { padding: 1.5rem 1rem; }
            .card { padding: 1.1rem 1.1rem 1.2rem; border-radius: 10px; }
            .header h1 { font-size: 1.9rem; }
            .header h1 span { font-size: 1.2rem; }
            .row { flex-direction: column; }
            .row button { width: 100%; }
            .modal-content { padding: 1.5rem; }
            .modal-header h2 { font-size: 1.4rem; }
        }

        /* ПК версия - увеличение карточек */
        @media (min-width: 769px) {
            .app {
                max-width: 620px;
                padding: 2.5rem 2rem;
            }

            .card {
                padding: 2.2rem 2.2rem 2.4rem;
            }

            .card .q {
                font-size: 1.1rem;
                line-height: 1.6;
            }

            .header {
                padding: 2.2rem 2rem;
                margin-bottom: 2.5rem;
            }

            .header h1 {
                font-size: 3rem;
            }

            .header .sub {
                font-size: 0.9rem;
                margin-top: 0.7rem;
            }

            .row input,
            .row button {
                height: 52px;
                font-size: 0.97rem;
            }

            .code-digit {
                width: 64px;
                height: 64px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

<noscript>
    <p>⚠️ JavaScript отключен. Пожалуйста, включите JavaScript для работы сайта.</p>
</noscript>

<div class="heatWave"></div>
<div class="grain"></div>

<button id="toggleBtn" class="toggle-interface-btn" onclick="toggleInterface()" title="Показать/Скрыть интерфейс">👁️</button>

<!-- Фиксированный фоновый слой -->
<div class="bg-fixed" style="background-image: url('docs/beach-mobile.jpeg');"></div>

<div class="app">
    <div class="code-strip" id="codeStrip">
        <div class="code-digit" id="code1"></div>
        <div class="code-digit" id="code2"></div>
        <div class="code-digit" id="code3"></div>
        <!-- Коды для puzzle4 появятся здесь -->
    </div>

    <div class="header">
        <h1 id="mainTitle">Три загадки</h1>
        <p class="sub" id="subtitle"></p>
    </div>

    <div id="puzzlesContainer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
try {
    // Флаг для защиты от дублирования запросов
    let isRequestInProgress = false;

    // Объект с картинками для каждого вопроса
    const bgImages = {
        1: { mobile: 'docs/IMG_9433.png', desktop: 'docs/IMG_9423A.png' },
        2: { mobile: 'docs/IMG_9433B.png', desktop: 'docs/IMG_9423B.jpg' },
        3: { mobile: 'docs/IMG_9433C.png', desktop: 'docs/IMG_9423C.jpg' },
        4: { mobile: 'docs/IMG_9433D.png', desktop: 'docs/IMG_9423D.png' }
    };

    // Прелоадим все картинки при загрузке (чтобы не было лагов)
    Object.values(bgImages).forEach(({ mobile, desktop }) => {
        new Image().src = mobile;
        new Image().src = desktop;
    });

    // Функция смены фона
    function changeBg(questionNumber) {
        const isMobile = window.innerWidth < 768;
        const imageUrl = isMobile ? bgImages[questionNumber].mobile : bgImages[questionNumber].desktop;
        
        const bgFixed = document.querySelector('.bg-fixed');
        if (bgFixed) {
            bgFixed.style.backgroundImage = `url('${imageUrl}')`;
        }
    }

    // Переключение видимости интерфейса
    function toggleInterface() {
        const app = document.querySelector('.app');
        app.classList.toggle('hidden');
    }

    // ===== ЗАГАДКИ =====
    const PUZZLES = [
        {
            id: 'puzzle1',
            text: '0JTQvdCw0YfRiyDQu9GG0LLRitGKINGF0LXRgtGG0Lcg0YvRhdGA0YjQu9GL0YUg0Y/RhdGF0YHRiCDCq9GF0LfRjtC20YPRj9GIwrsg0YrQudGC0YnRgSDRkdGK0YjQvNGJ0YTRidC00LbRjiDQutGD0LPRkdC00YrQuj8=',
            subtitle: 'Между 64 и 24 спрятан ключ — "Шляпка + нога"',
        },
        {
            id: 'puzzle2',
            text: 'О  01туяек1010вквиа0  0едлнр1111таяат1100огесы 00 мати 1111 зсп101110н яо101110а 0 0',
            subtitle: 'Если следовать вдоль рельсов, десятая отметка может оказаться важной',
        },
        {
            id: 'puzzle3',
            text: '..--- ..--- -....- ...-- ...-- -....- ..--- ..--- / .---- ----. -....- ...-- ...-- -....- ..--- ..... -....- ..... -....- ...-- .---- -....- ...-- ...-- -....- .---- ..... -....- ....- / .---- --... -....- ..--- ---.. -....- .---- -.... -....- ...-- .---- -....- ...-- ...-- -....- .---- / ..--- .---- -....- ..--- ---.. -....- .---- ....- -....- .---- ----. -....- .---- -....- .---- / ..--- ..--- -....- .---- ---.. -....- ..--- .---- -....- .---- ---.. -....- ..--- ----. -....- ...-- ...-- --..-- / ..--- ..--- -....- .---- ---.. -....- .---- ....- -....- .---- ---.. -....- .---- -.... -....- .---- ...-- -....- ..--- / ...-- .---- -....- ..... -....- .---- --... -....- .---- ...-- -....- .---- ..... -....- .---- ....- -....- ..--- ....- -....- ..--- .---- -....- ..--- ....- / ...-- .---- / .---- --... -....- .---- -.... -....- .---- ---.. -....- ---.. -....- ..--- .---- -....- .---- ---.. -....- ..--- ----- / ...-- ----- -....- .---- ---.. -....- ..--- ----. -....- .---- ...-- ..--..', 
            subtitle: 'Числа подскажут буквы, а конец подскажет начало',
        },
        {
            id: 'puzzle4',
            text: 'Какое слово было спрятано?',
            subtitle: 'найди все буквы на протяжении всех загадок',
        }
    ];

    const shuffledPuzzles = PUZZLES;

    const gameState = {
        solvedCount: 0,
        solvedPuzzles: {},
        puzzle4Code: null  // Код из puzzle4
    };

    for (let i = 0; i < shuffledPuzzles.length; i++) {
        gameState.solvedPuzzles[shuffledPuzzles[i].id] = false;
    }

    function createPuzzleHTML(puzzle, order) {
        const isFirstPuzzle = order === 0;
        const isHidden = order > 0 ? 'step-hidden' : '';
        const wrapperId = 'wrap_' + puzzle.id;
        const lockId = 'lock_' + puzzle.id;

        let html = '';
        
        if (!isFirstPuzzle) {
            html += '<div class="step-hidden" id="' + lockId + '"><div class="lock-box"><div class="lk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5a6a7a" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>Разгадай предыдущую загадку, чтобы открыть эту</div></div>';
        }

        html += '<div class="' + isHidden + '" id="' + wrapperId + '">' +
                '<div class="card" id="card_' + puzzle.id + '">' +
                '<div class="q" id="q_' + puzzle.id + '" style="white-space: pre-wrap;">' + puzzle.text + '</div>' +
                '<div class="attempts" id="att_' + puzzle.id + '"></div>' +
                '<div class="row" id="r_' + puzzle.id + '">' +
                '<input id="a_' + puzzle.id + '" placeholder="Твой ответ…" autocomplete="off" spellcheck="false">' +
                '<button type="button" id="btn_' + puzzle.id + '" onclick="checkAnswer(\'' + puzzle.id + '\')" onmousedown="handleButtonClick(event, \'' + puzzle.id + '\')">Ответить</button>' +
                '</div>' +
                '</div>' +
                '</div>';

        return html;
    }

    const container = document.getElementById('puzzlesContainer');
    let allHTML = '';
    // Создаем все 4 загадки
    for (let i = 0; i < shuffledPuzzles.length; i++) {
        allHTML += createPuzzleHTML(shuffledPuzzles[i], i);
    }
    container.innerHTML = allHTML;

    function handleButtonClick(event, puzzleId) {
        if (isRequestInProgress) {
            event.preventDefault();
            showToast('Запрос уже отправлен, подожди ответ...');
        }
    }

    function checkAnswer(puzzleId) {
        if (isRequestInProgress) {
            showToast('Запрос уже отправлен, подожди ответ...');
            return;
        }

        if (gameState.solvedPuzzles[puzzleId]) return;
        
        const puzzle = shuffledPuzzles.find(p => p.id === puzzleId);
        if (!puzzle) return;

        const input = document.getElementById('a_' + puzzleId);
        const value = input.value.trim();
        
        if (!value) {
            showToast('Напишите ответ');
            return;
        }

        const button = document.getElementById('btn_' + puzzleId);
        button.disabled = true;
        
        isRequestInProgress = true;

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxq-7xh85zN37QHHMxvMq39ne-nOdYZkwPpC1rNdeyCYaJg8NiAlW1TIbnfuX1LlBl5aQ/exec';

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                puzzleId: puzzleId,
                answer: value
            })
        })
        .then(response => {
            console.log('Response status:', response.status);
            if (!response.ok) {
                showToast('Ошибка: HTTP ' + response.status);
                button.disabled = false;
                return null;
            }
            return response.text().then(text => {
                console.log('Response text:', text);
                try {
                    return JSON.parse(text);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    showToast('Ошибка парсинга: ' + e.message);
                    button.disabled = false;
                    return null;
                }
            });
        })
        .then(data => {
            isRequestInProgress = false;
            if (!data) return;
            
            if (data.correct) {
                gameState.solvedPuzzles[puzzleId] = true;
                gameState.solvedCount++;
                input.disabled = true;

                const card = document.getElementById('card_' + puzzleId);
                card.classList.add('done');

                const row = document.getElementById('r_' + puzzleId);
                row.innerHTML = '<div class="done-row"><svg class="check-svg" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10"/><polyline points="8 13 12 17 18 10"/></svg>Верно</div>';

                const puzzleIndex = shuffledPuzzles.findIndex(p => p.id === puzzleId);
                if (puzzleIndex < shuffledPuzzles.length - 1) {
                    // Если это не последняя загадка
                    if (puzzleId !== 'puzzle3') {
                        // Для puzzle1 и puzzle2 открываем следующую автоматически
                        const nextPuzzle = shuffledPuzzles[puzzleIndex + 1];
                        setTimeout(function() {
                            document.getElementById('lock_' + nextPuzzle.id).style.display = 'none';
                            document.getElementById('wrap_' + nextPuzzle.id).classList.add('reveal');
                            document.getElementById('subtitle').textContent = nextPuzzle.subtitle;
                            document.getElementById('a_' + nextPuzzle.id).focus();
                            
                            // Меняем фон только для загадок 1, 2
                            if (puzzleIndex < 2) {
                                changeBg(puzzleIndex + 2);
                            }
                        }, 300);
                    } else {
                        // Если решена puzzle3 - делаем заголовок кликабельным и добавляем анимацию
                        const title = document.getElementById('mainTitle');
                        title.textContent = 'Три Загадки?';
                        title.classList.add('clickable');
                        title.classList.add('pulsing');
                    }
                } else if (puzzleId === 'puzzle4') {
                    // PUZZLE4 РЕШЕНА! Показываем 6 цифр
                    setTimeout(function() {
                        revealSixDigits(data.code);
                    }, 300);
                }

                revealDigit(gameState.solvedCount, data.code);
            } else {
                input.classList.add('shake');
                const qEl = document.getElementById('q_' + puzzleId);
                qEl.classList.add('error');
                
                const btn = document.querySelector('#r_' + puzzleId + ' button');
                btn.disabled = false;
                
                setTimeout(function() { 
                    qEl.classList.remove('error'); 
                }, 700);
                setTimeout(function() { 
                    input.classList.remove('shake'); 
                }, 450);
            }
        })
        .catch(error => {
            console.error('Fetch error:', error);
            showToast('Ошибка подключения: ' + error.message);
            isRequestInProgress = false;
            button.disabled = false;
        });
    }

    // ===== PUZZLE 4 =====
    function revealSixDigits(code) {
        const codeStr = code.toString().padStart(6, '0');
        const codeStrip = document.getElementById('codeStrip');
        
        // Очищаем старые элементы (коды 1, 2, 3)
        codeStrip.innerHTML = '';
        
        // Создаем 6 новых элементов для каждой цифры
        for (let i = 0; i < 6; i++) {
            const digit = document.createElement('div');
            digit.className = 'code-digit';
            digit.id = 'code-puzzle4-' + (i + 1);
            digit.textContent = codeStr[i];
            codeStrip.appendChild(digit);
            
            // Анимированное появление
            setTimeout(function() {
                digit.classList.add('revealed');
            }, i * 150);
        }
    }


    function revealDigit(pos, text) {
        setTimeout(function() {
            const el = document.getElementById('code' + pos);
            if (el) {
                el.textContent = text;
                el.classList.add('revealed');
            }
        }, 500);
    }

    let toastTimeout;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function() { 
            t.classList.remove('show'); 
        }, 1800);
    }

    document.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        
        // Проверяем загадки
        const f = document.activeElement;
        if (f.id && f.id.startsWith('a_')) {
            const puzzleId = f.id.substring(2);
            checkAnswer(puzzleId);
        }
    });

    // Обработчик клика на заголовок когда все 3 загадки решены
    document.getElementById('mainTitle').addEventListener('click', function() {
        if (this.classList.contains('clickable')) {
            // Открываем puzzle4
            const lock4 = document.getElementById('lock_puzzle4');
            const wrap4 = document.getElementById('wrap_puzzle4');
            if (lock4) lock4.style.display = 'none';
            if (wrap4) {
                wrap4.classList.add('reveal');
                document.getElementById('subtitle').textContent = PUZZLES.find(p => p.id === 'puzzle4').subtitle;
                document.getElementById('a_puzzle4').focus();
                // Меняем фон на 4й вопрос
                changeBg(4);
            }
            // Удаляем класс, чтобы можно было кликнуть только один раз
            this.classList.remove('clickable');
        }
    });

    setTimeout(function() {
        const firstPuzzle = shuffledPuzzles[0];
        document.getElementById('wrap_' + firstPuzzle.id).classList.add('reveal');
        document.getElementById('subtitle').textContent = firstPuzzle.subtitle;
        document.getElementById('a_' + firstPuzzle.id).focus();
        
        // Показываем фон первого вопроса
        changeBg(1);
    }, 100);

} catch (err) {
    console.error('Ошибка:', err.message);
    alert('Ошибка: ' + err.message);
}
</script>
</body>
</html>
