<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Три Загадки</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Yuji+Boku&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(30,25,50,0.5);
            --glass-border: rgba(255,255,255,0.08);
            --text: #f0ece4;
            --green: #8fd694;
            --red: #e8857c;
            --r: 6px;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0f24;
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: default;
        }

        #starCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .grain {
            position: fixed; inset: -50%; z-index: 2; pointer-events: none; opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            animation: grain-drift 8s steps(3) infinite;
        }
        @keyframes grain-drift { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-2px,1px)} 66%{transform:translate(1px,-2px)} }

        .app { position: relative; z-index: 3; width: 100%; max-width: 500px; padding: 2rem 1.5rem; }

        .code-strip {
            display: flex; justify-content: center; gap: 1.2rem;
            margin-bottom: 1.8rem; min-height: 3rem; align-items: center;
        }
        .code-digit {
            width: 56px; height: 56px; border-radius: 6px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: 700;
            font-family: 'Inter', monospace;
            color: transparent;
            transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
            letter-spacing: 0.03em;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .code-digit.revealed {
            color: #ffcc80;
            border-color: rgba(255,200,130,0.3);
            background: rgba(255,180,80,0.08);
            box-shadow: 0 0 24px rgba(255,180,80,0.12);
            animation: digit-pop 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes digit-pop {
            0% { transform: scale(0.7); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .header { text-align: center; margin-bottom: 2.2rem; }
        .header h1 {
            font-family: 'Yuji Boku', serif;
            font-size: 2.4rem; font-weight: 400;
            letter-spacing: 0.06em;
            color: #ffe0b0;
            text-shadow: 0 0 30px rgba(255,180,80,0.25), 0 2px 4px rgba(0,0,0,0.4);
            line-height: 1.3;
        }
        .header h1 span {
            display: block;
            font-size: 1.4rem;
            color: #ccc0a8;
            text-shadow: 0 0 16px rgba(255,200,140,0.15);
            margin-top: -4px;
        }
        .header .sub {
            font-size: 0.85rem; color: #998870; margin-top: 0.5rem;
            font-weight: 400; letter-spacing: 0.05em;
        }

        .card {
            background: linear-gradient(180deg, rgba(60,55,80,0.7) 0%, rgba(45,40,65,0.75) 100%);
            border: 1px solid rgba(255,220,180,0.1);
            border-radius: var(--r);
            padding: 1.3rem 1.4rem 1.4rem;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            transition: border-color 0.4s, background 0.4s, box-shadow 0.4s;
            margin-bottom: 0.7rem;
            position: relative; overflow: visible;
            box-shadow:
                0 2px 12px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.03);
            border-top: 3px solid transparent;
            border-image: linear-gradient(90deg,
                rgba(255,180,130,0.2), rgba(255,200,160,0.5),
                rgba(255,180,130,0.2)) 1;
        }
        .card::after {
            content: '';
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 10px;
            background: linear-gradient(180deg, rgba(255,200,160,0.5), rgba(255,180,130,0.15));
            border-radius: 3px 3px 0 0;
            opacity: 0.6;
        }
        .card.done {
            border-color: rgba(143,214,148,0.2);
            background: linear-gradient(180deg, rgba(50,70,55,0.7) 0%, rgba(40,55,45,0.75) 100%);
            box-shadow: 0 0 30px rgba(143,214,148,0.06), 0 2px 12px rgba(0,0,0,0.3);
            border-image: linear-gradient(90deg,
                rgba(143,214,148,0.15), rgba(143,214,148,0.4),
                rgba(143,214,148,0.15)) 1;
        }
        .card.done::after {
            background: linear-gradient(180deg, rgba(143,214,148,0.5), rgba(143,214,148,0.15));
        }
        .card .q {
            font-size: 0.9rem; font-weight: 500; margin-bottom: 0.85rem;
            transition: color 0.2s;
            word-break: break-all; overflow-wrap: anywhere; line-height: 1.5;
            color: #e8dcc8;
        }
        .card .q.error {
            color: var(--red);
            animation: q-flash 0.7s ease;
        }
        @keyframes q-flash {
            0%,100%{color:#e8dcc8}
            30%{color:var(--red)}
            70%{color:var(--red)}
        }
        .card .attempts { font-size: 0.68rem; color: #887860; margin-bottom: 0.6rem; min-height: 1em; transition: color 0.3s; }

        .row { display: flex; gap: 0.5rem; }
        .row input {
            flex: 1; height: 44px;
            background: rgba(40,35,55,0.5);
            border: 1px solid rgba(255,220,180,0.1);
            border-radius: 4px;
            padding: 0 0.9rem; color: #e8dcc8; font-size: 0.9rem;
            font-family: inherit; font-weight: 450;
            outline: none; transition: border-color 0.2s, background 0.2s;
        }
        .row input:focus {
            border-color: rgba(255,200,140,0.3);
            background: rgba(50,42,65,0.6);
        }
        .row input.shake {
            border-color: var(--red);
            animation: shake 0.4s ease;
        }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
        .row button {
            height: 44px; padding: 0 1.3rem; border: none; border-radius: 4px;
            background: linear-gradient(180deg, #ffcc90, #e8a860);
            color: #2a1f14; font-size: 0.85rem; font-weight: 600;
            font-family: inherit; cursor: pointer;
            transition: transform 0.12s, box-shadow 0.2s;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(200,140,80,0.2);
        }
        .row button:hover {
            background: linear-gradient(180deg, #ffd6a0, #efb870);
            box-shadow: 0 4px 16px rgba(220,160,90,0.3);
        }
        .row button:active { transform: scale(0.95); }

        .done-row {
            display: flex; align-items: center; gap: 0.5rem; height: 44px;
            color: var(--green); font-weight: 550; font-size: 0.9rem;
        }
        .done-row .check-svg { width: 26px; height: 26px; flex-shrink: 0; }
        .done-row .check-svg circle {
            fill: none; stroke: rgba(143,214,148,0.25); stroke-width: 2;
            stroke-dasharray: 63; stroke-dashoffset: 63;
            animation: circle-draw 0.6s 0.1s ease forwards;
        }
        .done-row .check-svg polyline {
            fill: none; stroke: var(--green); stroke-width: 2.5;
            stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 22; stroke-dashoffset: 22;
            animation: check-draw 0.4s 0.4s ease forwards;
        }
        @keyframes circle-draw { to { stroke-dashoffset: 0; } }
        @keyframes check-draw { to { stroke-dashoffset: 0; } }

        .step-hidden {
            display: none; opacity: 0; transform: translateY(12px);
        }
        .step-hidden.reveal {
            display: block;
            animation: stepIn 0.5s ease forwards;
        }
        @keyframes stepIn { to { opacity: 1; transform: translateY(0); } }

        .lock-box {
            display: flex; align-items: center; gap: 0.6rem; padding: 1rem 1.3rem;
            border: 1px dashed rgba(255,220,180,0.08); border-radius: var(--r);
            background: rgba(40,35,55,0.4);
            color: #887860; font-size: 0.84rem;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .lock-box .lk {
            width: 34px; height: 34px; border-radius: 4px;
            background: rgba(255,220,180,0.04);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(120px);
            background: rgba(40,35,55,0.85); border: 1px solid rgba(255,220,180,0.12);
            color: #e8dcc8; padding: 0.55rem 1.3rem; border-radius: 4px;
            font-size: 0.84rem; font-weight: 500;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            z-index: 100; transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        noscript {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0f24; display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        noscript p {
            text-align: center; color: #e8dcc8; font-size: 1.2rem; padding: 2rem;
            max-width: 400px;
        }

        @media (max-width: 460px) {
            .app { padding: 1.5rem 1rem; }
            .card { padding: 1.1rem 1.1rem 1.2rem; border-radius: 4px; }
            .header h1 { font-size: 1.9rem; }
            .header h1 span { font-size: 1.2rem; }
            .row { flex-direction: column; }
            .row button { width: 100%; }
        }
    </style>
</head>
<body>

<noscript>
    <p>⚠️ JavaScript отключен. Пожалуйста, включите JavaScript для работы сайта.</p>
</noscript>

<canvas id="starCanvas"></canvas>
<div class="grain"></div>

<div class="app">
    <div class="code-strip">
        <div class="code-digit" id="code1"></div>
        <div class="code-digit" id="code2"></div>
        <div class="code-digit" id="code3"></div>
    </div>

    <div class="header">
        <h1>三つの謎<span>Три загадки</span></h1>
        <p class="sub" id="subtitle"></p>
    </div>

    <div id="puzzlesContainer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
try {
    const canvas = document.getElementById('starCanvas');
    if (!canvas) throw new Error('Canvas не найден');
    
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('Context не инициализирован');
    
    let stars = [];
    let meteors = [];
    let fireflies = [];

    function resizeCanvas() { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    for (let i = 0; i < 180; i++) {
        stars.push({
            x: Math.random() * canvas.width, 
            y: Math.random() * canvas.height,
            r: Math.random() * 1.3 + 0.2,
            twinkle: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.015 + 0.004,
            baseAlpha: Math.random() * 0.4 + 0.25
        });
    }

    for (let i = 0; i < 25; i++) {
        fireflies.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height * 0.7 + canvas.height * 0.1,
            r: 1.5 + Math.random() * 2.5,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            phase: Math.random() * Math.PI * 2,
            pulseSpeed: 0.02 + Math.random() * 0.04,
            wanderTimer: Math.random() * 200
        });
    }

    function spawnMeteor() {
        meteors.push({
            x: Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
            y: Math.random() * canvas.height * 0.25,
            len: 40 + Math.random() * 80,
            speed: 4 + Math.random() * 6,
            angle: Math.PI / 4 + Math.random() * 0.3,
            alpha: 1,
            decay: 0.012 + Math.random() * 0.02
        });
    }

    function scheduleMeteor() {
        setTimeout(function() { 
            spawnMeteor(); 
            scheduleMeteor(); 
        }, 3000 + Math.random() * 5000);
    }
    scheduleMeteor();

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGrad.addColorStop(0, '#0a1030');
        bgGrad.addColorStop(0.5, '#0f1535');
        bgGrad.addColorStop(1, '#0c0e22');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            s.twinkle += s.speed;
            const alpha = s.baseAlpha + Math.sin(s.twinkle) * 0.2;
            ctx.beginPath(); 
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,250,240,' + Math.max(0.04, alpha) + ')'; 
            ctx.fill();
        }

        for (let i = 0; i < fireflies.length; i++) {
            const f = fireflies[i];
            f.phase += f.pulseSpeed;
            f.wanderTimer--;
            if (f.wanderTimer <= 0) {
                f.vx = (Math.random() - 0.5) * 0.5;
                f.vy = (Math.random() - 0.5) * 0.5;
                f.wanderTimer = 100 + Math.random() * 200;
            }
            f.x += f.vx;
            f.y += f.vy;
            
            if (f.x < 0 || f.x > canvas.width) f.vx *= -1;
            if (f.y < canvas.height * 0.1 || f.y > canvas.height * 0.85) f.vy *= -1;

            const glowAlpha = 0.3 + Math.sin(f.phase) * 0.25;
            const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 6);
            glow.addColorStop(0, 'rgba(200,255,140,' + glowAlpha + ')');
            glow.addColorStop(0.4, 'rgba(180,240,100,' + (glowAlpha * 0.5) + ')');
            glow.addColorStop(1, 'rgba(180,240,100,0)');
            ctx.fillStyle = glow;
            ctx.beginPath(); 
            ctx.arc(f.x, f.y, f.r * 6, 0, Math.PI * 2); 
            ctx.fill();
            
            ctx.beginPath(); 
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(220,255,180,' + (glowAlpha * 1.3) + ')'; 
            ctx.fill();
        }

        for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            const dx = Math.cos(m.angle) * m.len;
            const dy = Math.sin(m.angle) * m.len;
            const grad = ctx.createLinearGradient(m.x, m.y, m.x - dx, m.y - dy);
            grad.addColorStop(0, 'rgba(255,240,210,' + m.alpha + ')');
            grad.addColorStop(1, 'rgba(255,240,210,0)');
            ctx.beginPath(); 
            ctx.moveTo(m.x, m.y); 
            ctx.lineTo(m.x - dx, m.y - dy);
            ctx.strokeStyle = grad; 
            ctx.lineWidth = 1.3; 
            ctx.stroke();
            ctx.beginPath(); 
            ctx.arc(m.x, m.y, 1.8, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,230,190,' + m.alpha + ')'; 
            ctx.fill();
            m.x += Math.cos(m.angle) * m.speed;
            m.y += Math.sin(m.angle) * m.speed;
            m.alpha -= m.decay;
            if (m.alpha <= 0 || m.x > canvas.width + 100 || m.y > canvas.height + 100) {
                meteors.splice(i, 1);
            }
        }

        requestAnimationFrame(draw);
    }
    draw();

    // ===== ЗАГАДКИ БЕЗ РАНДОМИЗАЦИИ (всегда в порядке 1, 2, 3) =====
    const PUZZLES = [
        {
            id: 'puzzle1',
            text: '0JTQvdCw0YfRiyDQu9GG0LLRitGKINGF0LXRgtGG0Lcg0YvRhdGA0YjQu9GL0YUg0Y/RhdGF0YHRiCDCq9GF0LfRjtC20YPRj9GIwrsg0YrQudGC0YnRgSDRkdGK0YjQvNGJ0YTRidC00LbRjiDQutGD0LPRkdC00YrQuj8=',
            subtitle: 'Между 64 и 24 спрятан ключ — Remanga',
        },
        {
            id: 'puzzle2',
            text: 'О  01туяек1010вквиа0  0едлнр1111таяат1100огесы 00 мати 1111 зсп101110н яо101110а 0 0',
            subtitle: 'Если следовать вдоль рельсов, десятая отметка может оказаться важной',
        },
        {
            id: 'puzzle3',
            text: '..--- ..--- -....- ...-- ...-- -....- ..--- ..--- / .---- ----. -....- ...-- ...-- -....- ..--- ..... -....- ..... -....- ...-- .---- -....- ...-- ...-- -....- .---- ..... -....- ....- / .---- --... -....- ..--- ---.. -....- .---- -.... -....- ...-- .---- -....- ...-- ...-- -....- .---- / ..--- .---- -....- ..--- ---.. -....- .---- ....- -....- .---- ----. -....- .---- -....- .---- / ..--- ..--- -....- .---- ---.. -....- ..--- .---- -....- .---- ---.. -....- ..--- ----. -....- ...-- ...-- --..-- / ..--- ..--- -....- .---- ---.. -....- .---- ....- -....- .---- ---.. -....- .---- -.... -....- .---- ...-- -....- ..--- / ...-- .---- -....- ..... -....- .---- --... -....- .---- ...-- -....- .---- ..... -....- .---- ....- -....- ..--- ....- -....- ..--- .---- -....- ..--- ....- / ...-- .---- / .---- --... -....- .---- -.... -....- .---- ---.. -....- ---.. -....- ..--- .---- -....- .---- ---.. -....- ..--- ----- / ...-- ----- -....- .---- ---.. -....- ..--- ----. -....- .---- ...-- ..--..', 
            subtitle: 'Числа подскажут буквы, а конец подскажет начало',
        }
    ];

    // Сразу используем PUZZLES в нужном порядке (без перемешивания)
    const shuffledPuzzles = PUZZLES;

    const gameState = {
        solvedCount: 0,
        solvedPuzzles: {}
    };

    for (let i = 0; i < shuffledPuzzles.length; i++) {
        gameState.solvedPuzzles[shuffledPuzzles[i].id] = false;
    }

    // Создаём HTML для загадок
    function createPuzzleHTML(puzzle, order) {
        const isFirstPuzzle = order === 0;
        const isHidden = order > 0 ? 'step-hidden' : '';
        const wrapperId = 'wrap_' + puzzle.id;
        const lockId = 'lock_' + puzzle.id;

        let html = '';
        
        if (!isFirstPuzzle) {
            html += '<div class="step-hidden" id="' + lockId + '"><div class="lock-box"><div class="lk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#998870" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>Разгадай предыдущую загадку, чтобы открыть эту</div></div>';
        }

        html += '<div class="' + isHidden + '" id="' + wrapperId + '">' +
                '<div class="card" id="card_' + puzzle.id + '">' +
                '<div class="q" id="q_' + puzzle.id + '">' + puzzle.text + '</div>' +
                '<div class="attempts" id="att_' + puzzle.id + '"></div>' +
                '<div class="row" id="r_' + puzzle.id + '">' +
                '<input id="a_' + puzzle.id + '" placeholder="Твой ответ…" autocomplete="off" spellcheck="false">' +
                '<button type="button" onclick="checkAnswer(\'' + puzzle.id + '\')">Ответить</button>' +
                '</div>' +
                '</div>' +
                '</div>';

        return html;
    }

    // Вставляем загадки в контейнер
    const container = document.getElementById('puzzlesContainer');
    let allHTML = '';
    for (let i = 0; i < shuffledPuzzles.length; i++) {
        allHTML += createPuzzleHTML(shuffledPuzzles[i], i);
    }
    container.innerHTML = allHTML;

    // ===== ИГРОВАЯ ЛОГИКА =====
    // Функция SHA-256 хеширования
    function checkAnswer(puzzleId) {
        if (gameState.solvedPuzzles[puzzleId]) return;
        
        const puzzle = shuffledPuzzles.find(p => p.id === puzzleId);
        if (!puzzle) return;

        const input = document.getElementById('a_' + puzzleId);
        const value = input.value.trim();
        
        if (!value) {
            showToast('Напишите ответ');
            return;
        }

        // URL твоего Google Apps Script
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymi4VTZp3lqKtVq7J-OCFxUo4hmTUWbXpSvl6xHcZBT0LKLaM9vQLVLcy-jEY4jnv8dA/exec';

        // Отправляем ответ на проверку
        console.log('Отправляю запрос к:', SCRIPT_URL);
        console.log('Данные:', { puzzleId: puzzleId, answer: value });
        
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                puzzleId: puzzleId,
                answer: value
            })
        })
        .then(response => {
            console.log('Получен ответ со статусом:', response.status);
            if (!response.ok) {
                showToast('Ошибка: ERR_HTTP_' + response.status);
                return null;
            }
            return response.text().then(text => {
                console.log('Текст ответа:', text);
                try {
                    return JSON.parse(text);
                } catch (e) {
                    console.error('Ошибка парсинга JSON:', e);
                    showToast('Ошибка: ERR_PARSE');
                    return null;
                }
            });
        })
        .then(data => {
            console.log('Обработанные данные:', data);
            if (!data) return;
            
            if (data.correct) {
                // Ответ правильный!
                gameState.solvedPuzzles[puzzleId] = true;
                gameState.solvedCount++;
                input.disabled = true;

                const card = document.getElementById('card_' + puzzleId);
                card.classList.add('done');

                const row = document.getElementById('r_' + puzzleId);
                row.innerHTML = '<div class="done-row"><svg class="check-svg" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10"/><polyline points="8 13 12 17 18 10"/></svg>Верно</div>';

                // Показываем следующую загадку
                const puzzleIndex = shuffledPuzzles.findIndex(p => p.id === puzzleId);
                if (puzzleIndex < shuffledPuzzles.length - 1) {
                    const nextPuzzle = shuffledPuzzles[puzzleIndex + 1];
                    setTimeout(function() {
                        document.getElementById('lock_' + nextPuzzle.id).style.display = 'none';
                        document.getElementById('wrap_' + nextPuzzle.id).classList.add('reveal');
                        document.getElementById('subtitle').textContent = nextPuzzle.subtitle;
                        document.getElementById('a_' + nextPuzzle.id).focus();
                    }, 300);
                }

                // Открываем код из Google Sheet
                revealDigit(gameState.solvedCount, data.code);
            } else {
                // Ответ неправильный
                input.classList.add('shake');
                const qEl = document.getElementById('q_' + puzzleId);
                qEl.classList.add('error');
                setTimeout(function() { 
                    qEl.classList.remove('error'); 
                }, 700);
                setTimeout(function() { 
                    input.classList.remove('shake'); 
                }, 450);
            }
        })
        .catch(error => {
            console.error('Полная ошибка:', error);
            console.error('Тип ошибки:', error.name);
            console.error('Сообщение:', error.message);
            
            if (error.name === 'TypeError') {
                showToast('Ошибка: ERR_CORS - доступ заблокирован');
            } else if (error.name === 'AbortError') {
                showToast('Ошибка: ERR_TIMEOUT - запрос долго отвечает');
            } else {
                showToast('Ошибка: ERR_UNKNOWN - ' + error.message);
            }
        });
    }

    function revealDigit(pos, text) {
        setTimeout(function() {
            const el = document.getElementById('code' + pos);
            if (el) {
                el.textContent = text;
                el.classList.add('revealed');
            }
        }, 500);
    }

    let toastTimeout;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function() { 
            t.classList.remove('show'); 
        }, 1800);
    }

    document.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        const f = document.activeElement;
        if (f.id && f.id.startsWith('a_')) {
            const puzzleId = f.id.substring(2);
            checkAnswer(puzzleId);
        }
    });

    // Показываем первую загадку
    setTimeout(function() {
        const firstPuzzle = shuffledPuzzles[0];
        document.getElementById('wrap_' + firstPuzzle.id).classList.add('reveal');
        document.getElementById('subtitle').textContent = firstPuzzle.subtitle;
        document.getElementById('a_' + firstPuzzle.id).focus();
    }, 100);

} catch (err) {
    console.error('Ошибка инициализации:', err.message);
    alert('Ошибка: ' + err.message);
}
</script>
</body>
</html>
